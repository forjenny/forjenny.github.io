<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AniList-style activity feed and progress panels for Reeze." />
  <title>Home &middot; AniList</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icon.svg" />

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: rgb(11, 22, 34);
    }

    .page-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .music-toggle {
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      padding: 0;
      font-size: 1.2rem;
      line-height: 1;
      color: rgb(141, 178, 219);
      cursor: pointer;
      background: rgba(11, 22, 34, 0.8);
      border: 1px solid rgba(141, 178, 219, 0.4);
      border-radius: 50%;
    }

    .music-toggle:hover {
      color: rgb(255, 255, 255);
    }

    .music-toggle:focus-visible {
      outline: 2px solid rgb(61, 180, 242);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <audio id="bg-music" src="../assets/ss.mp3" loop preload="auto"></audio>

  <button class="music-toggle" id="musicToggle" type="button"
          aria-label="Mute music" aria-pressed="false">🔊</button>

  <iframe class="page-frame" id="pageFrame" src="index.html" title="AniList replica"></iframe>

  <script src="play.js"></script>
</body>
</html>
